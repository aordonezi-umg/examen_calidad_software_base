# S3: pruebas + análisis de SonarQube Cloud cuando el código llega a main.
name: SonarQube Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisis:
    name: Pruebas y análisis SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias (verificadas con hashes)
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements-lock.txt

      - name: Ejecutar pruebas con cobertura
        run: python -m pytest -v --cov --cov-report=xml --cov-report=term

      - name: Análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true